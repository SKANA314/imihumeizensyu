<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>クラップポケット</title>
</head>
<body>
    <header>
        <p>学派</p>
        <h1>クラップポケット</h1>
    </header>
    <button id="hamburger">≡</button>
    <div class="menu"><nav id="menu"></nav></div>
    <main>
        <!--
            div　タグ
            <div class="character"></div> キャラクター
            <div class="magic_table"></div> 魔法(表形式)
            <div class="magic_text"></div> 魔法(テキスト形式)
            <div class="item"></div> アイテム
            <div class="nosos"></div> 魔法病
            <div class="grid"></div> 3分割グリッド
         -->
        <h1>学派データ</h1>
        <div class="cotree_data">
            <p>
                <b>信条:</b><rt class="creed">しんじょう</rt><br>
                <b>学派レベル:</b><rt class="level">1</rt><br>
                <b>特記事項:</b><rt class="notes">希薄</rt><br>
                <b>蔵書:</b><rt class="magic">【後輩召喚】【魔族】</rt><br>
                <b>学派経験点:</b><rt class="experience">0/7</rt>
            </p>
        </div>
        
    </main>
    <footer>
        <p>※ 本作は、「河嶋陶一朗」「冒険支援株式会社」及び「株式会社新紀元社」が権利を有する『魔道書大戦RPG マギカロギア』の二次創作物です。（C）河嶋陶一朗/冒険企画局</p>
    </footer>
